<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="description" content="正方形の地図で、近くの作業場所を。空席マップの公開デモ。"><title>空席マップ</title><link rel="stylesheet" href="vendor/maplibre-gl.css"><link rel="stylesheet" href="style.css"><script defer src="vendor/maplibre-gl.js"></script><script defer src="app.js"></script></head><body>
<main>
<section id="explore" class="page">
<div class="map-shell"><div id="map" aria-label="施設を探す地図"></div><div class="map-caption"><span class="live-dot"></span><span id="area">新宿・早稲田</span><span class="count" id="result-count">50 サンプル</span></div></div>
<div class="legend"><span><i class="green"></i>空き</span><span><i class="orange"></i>やや混雑</span><span><i class="red"></i>満席</span><span><i class="gray"></i>不明</span></div>
<div class="actions"><button id="search-open">⌕ <span>場所を探す</span></button><button id="locate">◎ <span>現在地から探す</span></button></div>
<p class="muted small" id="location-status" role="status"></p>

<div id="nearby-list"></div>
</section>
<section id="facility" class="page" hidden><header><h1>施設管理</h1></header><label class="field">編集する施設<select id="facility-select"></select></label><h2>いまの混雑状況</h2><div class="crowd-buttons" id="crowd-buttons"></div><button class="text-button" id="unknown">不明に戻す</button><h2>施設情報</h2><form id="profile-form" class="card"><label>名前<input id="name" required maxlength="100"></label><label>メニュー<textarea id="menu" rows="3" maxlength="3000" placeholder="季節のメニュー・価格など"></textarea></label><label>営業時間<textarea id="hours" rows="2" maxlength="1000" placeholder="平日 9:00–18:00 / 水曜定休"></textarea></label><label>メモ<textarea id="memo" rows="3" maxlength="3000" placeholder="キャンペーン・臨時休業など"></textarea></label><button class="primary" type="submit">変更を保存</button><p id="save-status" role="status" class="small"></p></form></section>
<section id="history" class="page" hidden><header><h1>検知・履歴</h1></header><div class="card"><label class="switch-row">周辺検知を有効にする<input type="checkbox" id="consent" role="switch"></label><p id="detect-status" role="status" class="small muted">検知はオフです</p></div><h2>開発用訪問履歴</h2><div id="visits"></div><button id="clear-history" class="danger">検知を停止して履歴を削除</button></section>
</main>
<footer id="dock"><aside class="ad" aria-label="広告"><div class="ad-icon">☕</div><div><div class="ad-title">ひと息つける、次の場所。 <span>サンプル広告</span></div></div></aside><nav aria-label="メインメニュー"><button data-tab="explore" aria-current="page"><b>▧</b>空席マップ</button><button data-tab="facility"><b>▤</b>施設管理</button><button data-tab="history"><b>◷</b>検知・履歴</button></nav></footer>
<dialog id="search-dialog"><div class="dialog-head"><h2>場所を探す</h2><button data-close="search-dialog" aria-label="閉じる">✕</button></div><form id="search-form"><label>駅名・地名（任意）<input id="query" type="search" placeholder="例：新宿駅・梅田駅" maxlength="100"></label><label class="field">施設の種類<select id="category"><option value="">すべて</option><option>カフェ</option><option>図書館</option><option>自習室</option><option>コワーキング</option></select></label><label class="switch-row">空いている施設のみ<input type="checkbox" id="only-available" checked></label><button class="primary" id="search-submit">この条件で検索</button></form><p id="search-status" class="small" role="status"></p><div id="search-results"></div></dialog>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-name"></h2><button data-close="detail" aria-label="閉じる">✕</button></div><div id="detail-body"></div></dialog>
<dialog id="consent-dialog"><h2>周辺検知に同意しますか？</h2><p>屋内入店や施設の利用は確認できません。ページ表示中にサンプル施設周辺への進入・退出を推定し、施設名・時刻・滞在時間をこのブラウザだけに保存します。いつでも停止・削除できます。</p><button id="accept-consent" class="primary">同意して有効にする</button><button data-close="consent-dialog">キャンセル</button></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
